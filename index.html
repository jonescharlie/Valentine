<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      width: min(420px, 90vw);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
      color: #b83260;
    }

    p {
      color: #444;
      margin-bottom: 25px;
    }

    .buttons {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 15px;
      height: 60px; /* space for the runaway button */
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }

    #yesBtn {
      background: #ff4d79;
      color: white;
      box-shadow: 0 8px 20px rgba(255, 77, 121, 0.4);
      z-index: 1;
    }

    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      position: absolute;
      background: white;
      color: #b83260;
      border: 2px solid rgba(184, 50, 96, 0.3);
      left: 50%;
      top: 50%;
      transform: translate(60px, -50%); /* starts next to Yes */
    }

    .message {
      margin-top: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #b83260;
      min-height: 24px;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      animation: floatUp linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to   { transform: translateY(-120vh) scale(1.8); opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p>I have a very important question for you…</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙃</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const buttons = document.getElementById("buttons");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    function moveNoButton() {
      const padding = 10;
      const box = buttons.getBoundingClientRect();
      const btn = noBtn.getBoundingClientRect();

      const maxX = box.width - btn.width - padding * 2;
      const maxY = box.height - btn.height - padding * 2;

      const x = padding + Math.random() * Math.max(0, maxX);
      const y = padding + Math.random() * Math.max(0, maxY);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = "translate(0, 0)";
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("mousedown", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    yesBtn.addEventListener("click", () => {
      message.textContent = "YAY!! 💘 I knew you’d say yes 😄";
      noBtn.style.display = "none";
      launchHearts(30);
    });

    function launchHearts(count) {
      const hearts = ["💖","💘","💕","💗","❤️","💞"];
      for (let i = 0; i < count; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = Math.random() * 100 + "vw";
        h.style.bottom = "-20px";
        h.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4000);
      }
    }
  </script>
</body>
</html>
