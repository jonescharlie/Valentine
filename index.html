<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Be My Valentine 💘</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#ffdde1,#ee9ca7);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overflow:hidden;
    }

    .card{
      background:rgba(255,255,255,0.9);
      padding:30px;
      border-radius:18px;
      text-align:center;
      width:min(420px,90vw);
      box-shadow:0 12px 40px rgba(0,0,0,0.2);
      position:relative;
    }

    h1{ margin:0 0 10px; color:#b83260; }
    p{ margin:0 0 22px; color:#444; }

    /* This box keeps the buttons aligned */
    .button-area{
      position:relative;
      width: 320px;
      max-width: 100%;
      height: 64px;              /* fixed height = always lined up */
      margin: 0 auto;
    }

    /* Yes stays in normal flow, perfectly centered */
    .row{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }

    button{
      padding:12px 20px;
      font-size:16px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease;
      white-space:nowrap;
    }

    #yesBtn{
      background:#ff4d79;
      color:#fff;
      box-shadow:0 8px 20px rgba(255,77,121,.4);
      z-index:1;
    }
    #yesBtn:hover{ transform:scale(1.05); }

    /* No starts lined up next to Yes, but can be moved around inside the button-area */
    #noBtn{
      background:#fff;
      color:#b83260;
      border:2px solid rgba(184,50,96,.3);

      position:absolute;         /* allows moving without breaking layout */
      left: 50%;
      top: 50%;
      transform: translate(70px, -50%);  /* "next to" Yes by default */
    }

    .message{
      margin-top:18px;
      min-height:24px;
      font-weight:700;
      color:#b83260;
    }

    .heart{
      position:absolute;
      font-size:20px;
      pointer-events:none;
      animation:floatUp linear forwards;
    }
    @keyframes floatUp{
      from{ transform:translateY(0) scale(1); opacity:1; }
      to{ transform:translateY(-120vh) scale(1.8); opacity:0; }
    }
  </style>
</head>

<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p>I have a very important question for you…</p>

    <div class="button-area" id="area">
      <div class="row">
        <button id="yesBtn">Yes 💕</button>
        <!-- No button is positioned absolute but starts "next to" Yes -->
        <button id="noBtn">No 🙃</button>
      </div>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const area = document.getElementById("area");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    function moveNoButton() {
      const padding = 6;
      const areaRect = area.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // movement bounds inside the button area
      const maxX = areaRect.width - btnRect.width - padding * 2;
      const maxY = areaRect.height - btnRect.height - padding * 2;

      const x = padding + Math.random() * Math.max(0, maxX);
      const y = padding + Math.random() * Math.max(0, maxY);

      // place relative to the area
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    // Desktop: moves when you try to hover it
    noBtn.addEventListener("mouseenter", moveNoButton);

    // Mobile + desktop: moves when you try to touch/click it
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      message.textContent = "YAY!! 💘 I knew you’d say yes 😄";
      noBtn.style.display = "none";
      launchHearts(30);
    });

    function launchHearts(count) {
      const hearts = ["💖","💘","💕","💗","❤️","💞"];
      for (let i = 0; i < count; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        h.style.left = Math.random() * 100 + "vw";
        h.style.bottom = "-20px";
        h.style.animationDuration = (2 + Math.random() * 2) + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4500);
      }
    }
  </script>
</body>
</html>
